# When AS ships with a newer JDK than the previous version, the Gradle daemon must also
# run on that JDK or it will fail to load AS jars at dependency-resolution time.
# Set org.gradle.java.home in your user-level ~/.gradle/gradle.properties pointing to
# <as-install>/jbr. Do NOT commit that path here — it is machine-specific. Example:
#   org.gradle.java.home=D:\\coding\\android-studio-rabbit-can1\\jbr
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m